    <text x="170" y="282" font-size="8" font-weight="700" fill="#1B2334">シミュレーション終了時点の評価額分布</text>
    <g fill="#4F46E5" opacity="0.85">
      <rect x="185" y="380" width="10" height="20"/>
      <rect x="198" y="365" width="10" height="35"/>
      <rect x="211" y="345" width="10" height="55"/>
      <rect x="224" y="320" width="10" height="80"/>
      <rect x="237" y="300" width="10" height="100"/>
      <rect x="250" y="292" width="10" height="108"/>
      <rect x="263" y="298" width="10" height="102"/>
      <rect x="276" y="310" width="10" height="90"/>
      <rect x="289" y="330" width="10" height="70"/>
      <rect x="302" y="350" width="10" height="50"/>
      <rect x="315" y="368" width="10" height="32"/>
      <rect x="328" y="382" width="10" height="18"/>
      <rect x="341" y="392" width="10" height="8"/>
    </g>
    <line x1="260" y1="285" x2="260" y2="405" stroke="#8A8F9E" stroke-dasharray="3,3"/>
