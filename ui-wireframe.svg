      <rect x="235" y="190" width="65" height="32" fill="#A39CF2"/><text x="267" y="210" fill="#1B2334">0.51</text>
      <rect x="305" y="190" width="65" height="32" fill="#B3ADF5"/><text x="337" y="210" fill="#1B2334">0.44</text>
      <rect x="375" y="190" width="65" height="32" fill="#EFB8BC"/><text x="407" y="210" fill="#1B2334">-0.12</text>
      <rect x="445" y="190" width="65" height="32" fill="#4F46E5"/><text x="477" y="210" fill="#FFF">1.00</text>
