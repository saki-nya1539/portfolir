      <text x="170" y="368">MSFT</text><text x="230" y="368">30%</text><text x="290" y="368">+11.8%</text><text x="390" y="368">17.9%</text>
      <text x="170" y="384">GOOGL</text><text x="230" y="384">20%</text><text x="290" y="384">+9.5%</text><text x="390" y="384">19.2%</text>
      <text x="170" y="400">AMZN</text><text x="230" y="400">20%</text><text x="290" y="400">+13.1%</text><text x="390" y="400">22.6%</text>
    </g>
