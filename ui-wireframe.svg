    <rect x="12" y="135" width="126" height="16" rx="4" fill="#FFFFFF" stroke="#C9CDD8"/>
    <text x="12" y="164" font-size="8" fill="#8A8F9E">データソース</text>
    <circle cx="16" cy="176" r="3" fill="#4F46E5"/>
    <text x="24" y="179" font-size="7" fill="#1B2334">サンプル（オフライン）</text>
    <circle cx="16" cy="190" r="3" fill="none" stroke="#C9CDD8"/>
    <text x="24" y="193" font-size="7" fill="#1B2334">Yahoo Finance</text>
    <text x="12" y="216" font-size="8" fill="#8A8F9E">初期投資額</text>
    <rect x="12" y="221" width="126" height="16" rx="4" fill="#FFFFFF" stroke="#C9CDD8"/>
    <text x="12" y="252" font-size="8" fill="#8A8F9E">無リスク金利 / VaR信頼水準</text>
    <rect x="12" y="257" width="126" height="4" rx="2" fill="#DDE1EA"/>
    <circle cx="60" cy="259" r="5" fill="#4F46E5"/>
    <rect x="12" y="270" width="126" height="4" rx="2" fill="#DDE1EA"/>
    <circle cx="95" cy="272" r="5" fill="#4F46E5"/>
