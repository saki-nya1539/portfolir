    <text x="170" y="96" font-size="8" font-weight="700" fill="#1B2334">将来シナリオのファンチャート</text>
    <polygon points="180,230 220,225 260,215 300,200 340,195 380,175 420,180 460,155 500,165 540,140 580,150
