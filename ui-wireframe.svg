      <text x="340" y="70" fill="#8A8F9E">MSFT</text>
      <text x="410" y="70" fill="#8A8F9E">GOOGL</text>
      <text x="480" y="70" fill="#8A8F9E">AMZN</text>
      <!-- row labels -->
