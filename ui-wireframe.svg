    <rect x="0" y="10" width="150" height="440" rx="8" fill="#F8F9FB" stroke="#DDE1EA"/>
    <text x="12" y="32" font-size="10" font-weight="700" fill="#1B2334">（サイドバー共通）</text>

    <rect x="165" y="24" width="460" height="200" rx="6" fill="#FFFFFF" stroke="#E3E5EC"/>
    <text x="178" y="44" font-size="9" font-weight="700" fill="#1B2334">分析レポートのダウンロード</text>
    <text x="178" y="66" font-size="8" fill="#5B6072">現在の分析結果をもとに、HTML形式の</text>
    <text x="178" y="80" font-size="8" fill="#5B6072">レポートを生成します。</text>
    <rect x="178" y="96" width="230" height="30" rx="5" fill="#4F46E5"/>
    <text x="293" y="116" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600">⬇ レポートをダウンロード（HTML）</text>
