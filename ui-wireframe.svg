      <text x="323" y="58" fill="#FFFFFF" font-size="16" font-weight="700">14.2%</text>

      <rect x="466" y="20" width="145" height="50" rx="6" fill="#4F46E5"/>
      <text x="476" y="36" fill="#E4E2FF" font-size="8">中央値評価額</text>
      <text x="476" y="58" fill="#FFFFFF" font-size="14" font-weight="700">¥1,142,000</text>
