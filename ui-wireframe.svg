  <rect x="0" y="0" width="1360" height="1000" fill="#EEF0F4"/>

  <text x="30" y="34" font-size="22" font-weight="700" fill="#1B2334">PortfoliR — UIワイヤーフレーム</text>

  <!-- ============ Panel 1: ダッシュボード ============ -->
