      <text x="170" y="58" fill="#FFFFFF" font-size="16" font-weight="700">+12.4%</text>

      <rect x="313" y="20" width="145" height="52" rx="6" fill="#6C757D"/>
      <text x="323" y="36" fill="#EDEDED" font-size="8">年率ボラティリティ</text>
      <text x="323" y="58" fill="#FFFFFF" font-size="16" font-weight="700">18.7%</text>

      <rect x="466" y="20" width="145" height="52" rx="6" fill="#0DCAF0"/>
      <text x="476" y="36" fill="#053642" font-size="8">シャープレシオ</text>
