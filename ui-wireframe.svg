      <text x="222" y="138" fill="#8A8F9E" text-anchor="end">MSFT</text>
      <text x="222" y="173" fill="#8A8F9E" text-anchor="end">GOOGL</text>
      <text x="222" y="208" fill="#8A8F9E" text-anchor="end">AMZN</text>

      <!-- row AAPL -->
      <rect x="235" y="85" width="65" height="32" fill="#4F46E5"/><text x="267" y="105" fill="#FFF">1.00</text>
      <rect x="305" y="85" width="65" height="32" fill="#8B84F0"/><text x="337" y="105" fill="#FFF">0.62</text>
      <rect x="375" y="85" width="65" height="32" fill="#B3ADF5"/><text x="407" y="105" fill="#1B2334">0.41</text>
      <rect x="445" y="85" width="65" height="32" fill="#A39CF2"/><text x="477" y="105" fill="#1B2334">0.51</text>

      <!-- row MSFT -->
      <rect x="235" y="120" width="65" height="32" fill="#8B84F0"/><text x="267" y="140" fill="#FFF">0.62</text>
      <rect x="305" y="120" width="65" height="32" fill="#4F46E5"/><text x="337" y="140" fill="#FFF">1.00</text>
      <rect x="375" y="120" width="65" height="32" fill="#C9C4F7"/><text x="407" y="140" fill="#1B2334">0.35</text>
      <rect x="445" y="120" width="65" height="32" fill="#B3ADF5"/><text x="477" y="140" fill="#1B2334">0.44</text>

      <!-- row GOOGL -->
      <rect x="235" y="155" width="65" height="32" fill="#B3ADF5"/><text x="267" y="175" fill="#1B2334">0.41</text>
      <rect x="305" y="155" width="65" height="32" fill="#C9C4F7"/><text x="337" y="175" fill="#1B2334">0.35</text>
      <rect x="375" y="155" width="65" height="32" fill="#4F46E5"/><text x="407" y="175" fill="#FFF">1.00</text>
      <rect x="445" y="155" width="65" height="32" fill="#EFB8BC"/><text x="477" y="175" fill="#1B2334">-0.12</text>

