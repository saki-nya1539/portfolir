    <text x="178" y="160" font-size="7" fill="#A7ABB8">※本アプリの分析結果はデモ・教育目的のシミュレー</text>
    <text x="178" y="172" font-size="7" fill="#A7ABB8">ションです。投資助言ではありません。実際の投資</text>
    <text x="178" y="184" font-size="7" fill="#A7ABB8">判断はご自身の責任で行ってください。</text>

    <!-- report preview mock -->
    <rect x="165" y="238" width="460" height="188" rx="6" fill="#FBFBFD" stroke="#E3E5EC"/>
    <text x="178" y="256" font-size="8" font-weight="700" fill="#1B2334">レポートプレビュー（HTML出力イメージ）</text>
    <rect x="178" y="266" width="180" height="10" rx="2" fill="#DDE1EA"/>
    <rect x="178" y="282" width="300" height="7" rx="2" fill="#EEF0F4"/>
    <rect x="178" y="294" width="260" height="7" rx="2" fill="#EEF0F4"/>
    <rect x="178" y="312" width="120" height="60" rx="4" fill="#FFFFFF" stroke="#E3E5EC"/>
    <polyline points="184,360 200,352 216,356 232,340 248,346 264,326" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="310" y="312" width="290" height="60" rx="4" fill="#FFFFFF" stroke="#E3E5EC"/>
    <text x="318" y="326" font-size="7" fill="#8A8F9E">指標</text><text x="380" y="326" font-size="7" fill="#8A8F9E">値</text>
    <text x="318" y="340" font-size="7" fill="#1B2334">年率リターン</text><text x="380" y="340" font-size="7" fill="#1B2334">+12.4%</text>
    <text x="318" y="354" font-size="7" fill="#1B2334">シャープレシオ</text><text x="380" y="354" font-size="7" fill="#1B2334">0.66</text>
    <text x="318" y="368" font-size="7" fill="#1B2334">ヒストリカルVaR</text><text x="380" y="368" font-size="7" fill="#1B2334">2.1%</text>
  </g>
</svg>
